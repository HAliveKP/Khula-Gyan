# Starting settings from the project blueprint. Measure and tune them on the
# verified evaluation questions; score thresholds are not universal guarantees.
embedding_model: BAAI/bge-m3
reranker_model: BAAI/bge-reranker-v2-m3
chunk_tokens: 400
chunk_overlap: 50
retrieve_k: 20
final_k: 5
rrf_k: 60
guard_min_score: 0.35
max_latency_seconds: 8

# Member 3 (generation and evaluation)
# Dense-search similarity is normalized to 0-1; this is a starting point, not calibrated.
# Keep the guard enabled until it is calibrated on verified answerable and refusal cases.
support_check: false   # guard v2 (second LLM call); turn on on Day 6 if it helps the numbers
