  filename: opendatanepal_environment_statistics_2019.html
  service: reference
  lang: en
  license: Creative Commons Attribution Share-Alike
  terms_url: https://opendatanepal.com/privacy-policy
  answer_evidence: false
  legacy: true
  relevance: Explicitly licensed environmental data, not civic procedure. Retained only as
    an open-licence reference; do not include in the civic retrieval index.
  licence_status: confirmed open
  terms_quote: 'Users are free to use, modify, and share datasets, provided they give appropriate
    attribution. https://opendatanepal.com/privacy-policy'
  date_checked: '2026-10-10'
  local_only: false

