- id: opendatanepal_ncd_dataset_page
  title: Non-Communicable Disease Risk Factors and Prevalence, Nepal (2013–2019) dataset
    page
  publisher: Open Knowledge Nepal, Open Data Nepal
  url: https://opendatanepal.com/dataset/non-communicable-disease-risk-factors-and-prevalence-nepal-2013-to-2019
  filename: opendatanepal_ncd_dataset_page.html
  service: reference
  lang: en
  license: null
  terms_url: https://opendatanepal.com/privacy-policy
  answer_evidence: false
  legacy: true
  relevance: Health data is unrelated to civic procedure answers. The dataset metadata
    says License Not specified, so it is excluded from the retrieval index and not approved
    as confirmed open.
  licence_status: unclear
  terms_quote: 'Dataset metadata: "License Not specified." Data Policy: "Unless otherwise
    stated, datasets are made available under an open license (such as Creative Commons
    Attribution 4.0)." https://opendatanepal.com/privacy-policy'
  date_checked: '2026-10-10'
  local_only: true
